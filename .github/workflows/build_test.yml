name: Full Install & Build Tests

on:
  push:
    branches:
      - main
      - future-ref
  pull_request:
    branches: 
      - '**'
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        container:
          - "ros:humble-ros-base"
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('dependencies.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Base Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
          curl gnupg2 lsb-release software-properties-common \
          locales \
          git \
          x11-apps \
          mesa-utils \
          gettext-base 

      - name: Install Project Dependencies
        run: |
          envsubst < dependencies.txt | xargs apt-get install -y --no-install-recommends

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git submodule update --init --recursive

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build All
        run: |
          export PARALLEL_JOBS=1
          export CMAKE_BUILD_PARALLEL_LEVEL=1
          make build_dir="$GITHUB_WORKSPACE" build-all

      - name: Run repository tests
        run: |
          make build_dir="$GITHUB_WORKSPACE" test-all

      - name: Report test results
        if: always()
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --test-result-base "$GITHUB_WORKSPACE/build" --verbose
